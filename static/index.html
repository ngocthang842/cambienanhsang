<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Anti Sleep System</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dfe3ea;--pri:#2457d6;--ok:#17803d;--bad:#c62828;--warn:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:170px 1fr 310px;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--bd);padding:14px 0}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;font:inherit;cursor:pointer;border-left:3px solid transparent;color:var(--tx)}
nav button.on{background:var(--bg);border-left-color:var(--pri);font-weight:600}
nav label{display:block;padding:14px;color:var(--mut);font-size:13px;border-top:1px solid var(--bd);margin-top:10px}
main{padding:14px;min-width:0}
aside{background:var(--card);border-left:1px solid var(--bd);padding:12px;overflow:auto;max-height:100vh}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
aside .card{background:var(--bg)}
h2{font-size:14px;margin:0 0 8px}

/* thanh điều khiển phía trên video */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.cb{border:0;border-radius:6px;padding:8px 16px;font:600 14px system-ui;color:#fff;cursor:pointer}
.cb.g{background:#22b04e}.cb.r{background:#ee1c25}
#runtxt{color:var(--mut);font-size:13px;margin-left:6px}

#cam{width:100%;aspect-ratio:4/3;max-height:58vh;object-fit:contain;background:#222;border-radius:8px;display:block}

/* đèn báo */
.lamps{display:flex;justify-content:space-around;align-items:flex-start;margin:18px 0 6px}
.lw{text-align:center}
.lamp{width:230px;height:130px;border-radius:50%;border:4px solid #000;transition:background .15s,box-shadow .15s}
.lamp.g{background:#0e3a1b}
.lamp.g.on{background:#22c55e;box-shadow:0 0 50px 14px rgba(34,197,94,.6)}
.lamp.r{background:#4a1114}
.lamp.r.on{background:#ff1f2b;box-shadow:0 0 50px 14px rgba(255,31,43,.7);animation:lampblink .5s infinite}
@keyframes lampblink{0%,100%{opacity:1}50%{opacity:.2}}
.lbl{margin-top:10px;font-weight:700;letter-spacing:.5px;color:var(--mut)}
.lw.gon .lbl{color:var(--ok)}.lw.ron .lbl{color:var(--bad)}

.big{font-size:22px;font-weight:700;text-align:center;padding:14px;border-radius:8px;background:#e9ebf0;color:var(--mut)}
.big.ok{background:#e4f5ea;color:var(--ok)}
.big.bad{background:#fde8e8;color:var(--bad);animation:blink .6s infinite}
.big.warn{background:#fff4dd;color:var(--warn)}
@keyframes blink{50%{opacity:.45}}
.snaps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.snaps.wide{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.snap{background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden;cursor:zoom-in;font-size:12px;text-align:center}
.snap img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.snap span{display:block;padding:3px;color:var(--bad);font-weight:600}
.log{max-height:200px;overflow:auto;margin:0;padding:0;list-style:none}
.log li{padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .warn{color:var(--warn)}
.stat b{font-size:22px;display:block}.stat span{color:var(--mut);font-size:12px}
.empty{color:var(--mut);font-size:13px}
.hide{display:none!important}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:50;cursor:zoom-out}
#lb img{max-width:92vw;max-height:90vh;border-radius:8px}
@media (max-width:860px){.app{grid-template-columns:1fr}.lamp{width:140px;height:80px}}
</style>
</head>
<body>
<div class="app">
  <nav>
    <button id="t1" class="on" onclick="tab(1)">🏠 Chung</button>
    <button id="t2" onclick="tab(2)">📊 Dashboard</button>
    <label><input type="checkbox" id="snd" checked onchange="toggleSound()"> 🔊 Còi báo động</label>
  </nav>

  <main>
    <div id="v1">
      <div class="card">
        <div class="bar">
          <button class="cb g" onclick="ctl('start')">▶ Bắt đầu</button>
          <button class="cb r" onclick="ctl('stop')">■ Dừng</button>
          <span id="runtxt">Chưa chạy</span>
        </div>
        <img id="cam" src="/video" alt="camera">
        <div class="lamps">
          <div class="lw" id="lwG"><div class="lamp g" id="lampG"></div><div class="lbl">TỈNH TÁO</div></div>
          <div class="lw" id="lwR"><div class="lamp r" id="lampR"></div><div class="lbl">NGỦ GẬT</div></div>
        </div>
      </div>
    </div>

    <div id="v2" class="hide">
      <div class="card">
        <h2>Thống kê phiên hiện tại</h2>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <div class="stat"><b id="dCount">0</b><span>Số lần ngủ gật</span></div>
          <div class="stat"><b id="dTime">0s</b><span>Thời gian giám sát</span></div>
          <div class="stat"><b id="dEar">0</b><span>EAR hiện tại</span></div>
        </div>
      </div>
      <div class="card"><h2>Tất cả ảnh chụp khi ngủ gật</h2><div class="snaps wide" id="snapsAll"></div></div>
      <div class="card"><h2>Toàn bộ nhật ký</h2><ul class="log" id="logAll" style="max-height:50vh"></ul></div>
    </div>
  </main>

  <aside>
    <div class="card"><h2>⚠ Cảnh báo</h2><div class="big" id="state">CHƯA CHẠY</div></div>
    <div class="card"><h2>📸 Ảnh chụp khi ngủ gật</h2><div class="snaps" id="snaps"></div></div>
    <div class="card"><h2>📝 Nhật ký</h2><ul class="log" id="log"></ul>
      <div class="stat" style="margin-top:8px"><b id="cnt">0</b><span>Lần ngủ gật trong phiên</span></div></div>
  </aside>
</div>

<div id="lb" class="hide" onclick="this.classList.add('hide')"><img id="lbImg" alt=""></div>

<script>
const $ = id => document.getElementById(id);
function tab(n){
  [1,2].forEach(i => { $("v"+i).classList.toggle("hide", i!==n); $("t"+i).classList.toggle("on", i===n); });
}

/* ---------- Còi báo động (Web Audio) ---------- */
let ac = null, osc = null, sirenT = null;
function unlock(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === "suspended") ac.resume();
}
function startSiren(){
  if(sirenT || !$("snd").checked || !ac) return;
  osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = "square"; g.gain.value = 0.2;
  osc.connect(g); g.connect(ac.destination);
  osc.start();
  let hi = false;
  osc.frequency.value = 700;
  sirenT = setInterval(() => { hi = !hi; osc.frequency.setValueAtTime(hi ? 1100 : 700, ac.currentTime); }, 300);
}
function stopSiren(){
  if(sirenT){ clearInterval(sirenT); sirenT = null; }
  if(osc){ try{ osc.stop(); }catch(e){} osc.disconnect(); osc = null; }
}
function toggleSound(){ unlock(); if(!$("snd").checked) stopSiren(); }

async function ctl(a){
  unlock();                                   // bấm nút = cho phép trình duyệt phát âm thanh
  await fetch("/api/"+a, {method:"POST"});
}

/* ---------- Giao diện ---------- */
const NAME = {IDLE:["CHƯA CHẠY",""], OK:["TỈNH TÁO","ok"], SLEEPING:["⚠ NGỦ GẬT!","bad"], NO_FACE:["KHÔNG THẤY MẶT","warn"]};
const li = e => `<li class="${e.level}">${e.time} · ${e.text}</li>`;
const snapHtml = e => `<div class="snap" onclick="showImg('${e.img}')"><img src="${e.img}" alt=""><span>${e.time}</span></div>`;
function showImg(u){ $("lbImg").src = u; $("lb").classList.remove("hide"); }
let lastSnapKey = "";

async function poll(){
  try{
    const s = await (await fetch("/api/status")).json();
    const [txt, cls] = NAME[s.state] || NAME.IDLE;
    $("state").textContent = txt; $("state").className = "big " + cls;
    $("runtxt").textContent = s.running ? "Đang giám sát" : "Chưa chạy";

    // đèn báo: xanh sáng khi tỉnh táo, đỏ nhấp nháy khi ngủ gật
    const okOn = s.state === "OK", badOn = s.state === "SLEEPING";
    $("lampG").classList.toggle("on", okOn); $("lwG").classList.toggle("gon", okOn);
    $("lampR").classList.toggle("on", badOn); $("lwR").classList.toggle("ron", badOn);

    $("cnt").textContent = s.sleep_count; $("dCount").textContent = s.sleep_count;
    $("dTime").textContent = s.uptime + "s"; $("dEar").textContent = s.ear;
    $("log").innerHTML = s.events.slice(0,8).map(li).join("") || '<li class="empty">Chưa có</li>';
    $("logAll").innerHTML = s.events.map(li).join("") || '<li class="empty">Chưa có</li>';

    const snaps = s.events.filter(e => e.img);
    const key = snaps.map(e => e.img).join("|");
    if(key !== lastSnapKey){                  // chỉ vẽ lại khi có ảnh mới, đỡ nhấp nháy
      lastSnapKey = key;
      $("snaps").innerHTML = snaps.slice(0,6).map(snapHtml).join("") || '<div class="empty">Chưa có ảnh</div>';
      $("snapsAll").innerHTML = snaps.map(snapHtml).join("") || '<div class="empty">Chưa có ảnh</div>';
    }

    if(s.state === "SLEEPING") startSiren(); else stopSiren();
  }catch(e){}
}
setInterval(poll, 500);
document.addEventListener("keydown", e => { if(e.key === "Escape") $("lb").classList.add("hide"); });
</script>
</body>
</html>
